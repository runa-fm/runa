[package]
name = "runa-fm"
description = "A fast, keyboard-focused terminal file manager (TUI). Highly configurable and lightweight."
version = "0.15.8-alpha.2"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/runa-fm/runa"
homepage = "https://runa-fm.github.io/runa/"
readme = "README.md"
authors = ["Alexandros McCray <alexandros@amccray.com>"]
categories = ["filesystem", "command-line-utilities", "command-line-interface"]
keywords = ["file-browser", "file-manager", "tui", "cli", "search"]
exclude = ["packaging/", ".packit.yml", "benches/", "docs/book/"]
autobenches = false

[lib]
name = "runa"
path = "src/lib.rs"
bench = false
doctest = false

[[bin]]
name = "rn"
path = "src/main.rs"
bench = false
test = false

[[bench]]
name = "time"
harness = false

[[bench]]
name = "report"
harness = false

[[bench]]
name = "disk"
harness = false
bench = false

[dependencies]
crossbeam-channel = "0.5.17"
dashmap = { version = "6.2.1", default-features = false }
fuzzy-matcher = "0.3.7"
humansize = "2.1.3"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
phf = { version = "0.14.0", default-features = false, features = ["macros"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2.3"
which = "8.0.6"

[target.'cfg(target_os = "windows")'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
trash = { version = "5.4.0", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "9.0.0", default-features = true }
trash = { version = "5.4.0", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = { version = "9.0.0", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
trash = { version = "5.4.0", default-features = false, features = ["freedesktop"] }

[target.'cfg(unix)'.dependencies]
uzers = { version = "0.12.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rand = "0.10.4"
stats_alloc = "0.1.10"
tempfile = "3.27.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
