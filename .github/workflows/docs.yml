name: Deploy Documentation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install mdBook
        env:
          MDBOOK_VERSION: "v0.5.2"
          PACKAGE_NAME: "mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz"
          MDBOOK_SHA256: "084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin

          gh release download "$MDBOOK_VERSION" \
            --repo rust-lang/mdBook \
            --pattern "$PACKAGE_NAME" \
            -D bin

          echo "$MDBOOK_SHA256  bin/$PACKAGE_NAME" | sha256sum -c
          tar -xzf "bin/$PACKAGE_NAME" -C bin
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
