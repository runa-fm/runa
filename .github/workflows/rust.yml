name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Gnu & Musl
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-aarch64-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-aarch64-musl
          - target: powerpc64le-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-ppc64le-gnu

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: windows-aarch64

          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64

    env:
      RELEASE_BUILD: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find bat
          mkdir -p ~/.local/bin
          ln -s $(which fdfind) ~/.local/bin/fd
          ln -s $(which batcat) ~/.local/bin/bat
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install musl C compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install ppc64le linker
        if: matrix.target == 'powerpc64le-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-powerpc64le-linux-gnu
          echo "CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER=powerpc64le-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install fd bat

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install fd bat || echo "Ignored choco failure"

      - name: Build
        id: build_step
        run: cargo build --release --locked --target ${{ matrix.target }}
        shell: bash

      - name: Test
        id: test_step
        if: matrix.target != 'powerpc64le-unknown-linux-gnu' && matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --release --locked --target ${{ matrix.target }}
        shell: bash

      - name: Prepare binary (Linux/macOS)
        if: env.RELEASE_BUILD == 'true' && runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rn" dist/rn
          chmod +x dist/rn
        shell: bash

      - name: Prepare binary (Windows)
        if: env.RELEASE_BUILD == 'true' && runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rn.exe" dist/rn.exe
        shell: pwsh

      - name: Upload artifact
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.platform }}
          path: dist/rn*
          if-no-files-found: error

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MSRV toolchain
        run: rustup default "$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
      - run: cargo check --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check License tag
        run: packaging/check-licenses.sh

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get month
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ steps.month.outputs.month }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit

      - name: Run Audit
        run: cargo audit --deny warnings
