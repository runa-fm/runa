name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
assignees:
  - alexm-dev
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version
      description: Paste the output of `rn -vV`.
      placeholder: |
        runa 0.15.4 (...)
        rustc: ...
        target: x86_64-unknown-linux-gnu
        profile: release
      render: text
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: What CPU architecture are you using?
      options:
        - x86_64 (x64)
        - ARM64 (aarch64)
        - POWERPC64
    validations:
      required: true

  - type: dropdown
    id: terminal_emulator
    attributes:
      label: Terminal
      description: Which terminal are you using?
      options:
        - Alacritty
        - Kitty
        - WezTerm
        - Ghostty
        - Konsole
        - GNOME Terminal
        - Windows Terminal
        - iTerm
        - Warp
        - st
        - Other / not listed
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant output, wrapped in a ``` code block.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Upload screenshots
      description: Drag and drop screenshots here to help explain your problem.
    validations:
      required: false
