specfile_path: packaging/fedora/runa.spec
upstream_package_name: runa
downstream_package_name: runa
upstream_tag_template: "v{version}"

srpm_build_deps:
  - cargo
  - cargo-vendor-filterer
  - xz

actions:
  create-archive:
    - bash -c "git archive --prefix=runa-${PACKIT_PROJECT_VERSION}/ -o packaging/fedora/runa-${PACKIT_PROJECT_VERSION}.tar.gz HEAD"
    - bash -c "cargo metadata --locked --format-version 1 >/dev/null"
    - bash -c "cargo vendor-filterer --platform x86_64-unknown-linux-gnu --platform aarch64-unknown-linux-gnu packaging/fedora/vendor >/dev/null"
    - bash -c "tar -C packaging/fedora -cJf packaging/fedora/runa-vendor.tar.xz vendor"
    - bash -c "echo packaging/fedora/runa-${PACKIT_PROJECT_VERSION}.tar.gz"

jobs:
  - job: copr_build
    trigger: release
    owner: alexm-dev
    project: runa
    enable_net: false
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
      - fedora-all-ppc64le

  - job: copr_build
    trigger: pull_request
    enable_net: false
    targets:
      - fedora-latest-stable
